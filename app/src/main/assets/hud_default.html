<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>JARVIS</title>
<style>
:root{--c:#27f3e4;--dim:rgba(39,243,228,.55);--bg:#010a0c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--c);overflow:hidden;
  font-family:"Segoe UI",Roboto,"Noto Sans Bengali",Arial,sans-serif;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 44%,rgba(14,112,112,.6),rgba(2,30,34,.92) 46%,#010a0c 78%)}
.hex{position:fixed;left:-26px;top:60%;width:170px;height:190px;opacity:.1;-webkit-mask-image:radial-gradient(circle at 35% 35%,#000,transparent 72%);mask-image:radial-gradient(circle at 35% 35%,#000,transparent 72%)}
.top{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:8px 10px 0}
.title{position:absolute;left:0;right:0;top:14px;text-align:center;font-style:italic;font-weight:600;
  letter-spacing:.32em;font-size:13px;color:#9bfff6;text-shadow:0 0 9px var(--c);pointer-events:none}
.ib{width:44px;height:44px;border:0;background:transparent;color:var(--c);display:grid;place-items:center;border-radius:50%;padding:0}
.ib:active{background:rgba(39,243,228,.14)}
.ib.off{color:rgba(39,243,228,.35)}
svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.link{position:relative;z-index:3;text-align:center;font-size:11px;color:var(--dim);padding:0 14px;min-height:16px;margin-top:-4px}
.link i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e0a030;margin-right:6px;box-shadow:0 0 6px currentColor}
.link i.on{background:var(--c)}
.stage{position:relative;z-index:1;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%}
.sub{position:absolute;left:20px;right:20px;bottom:10px;text-align:center;font-size:15px;line-height:1.4;color:#d4fffc;
  text-shadow:0 0 10px rgba(39,243,228,.65);max-height:6.4em;overflow:hidden;opacity:0;transition:opacity .7s}
.sub.show{opacity:1}
nav{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-around;
  padding:8px 4px 10px;background:linear-gradient(rgba(1,16,18,0),rgba(1,18,20,.92));border-top:1px solid rgba(39,243,228,.16)}
.mic{width:68px;height:68px;border-radius:50%;border:1.5px solid var(--c);color:var(--c);display:grid;place-items:center;
  background:radial-gradient(circle,rgba(39,243,228,.22),rgba(0,0,0,.25));box-shadow:0 0 18px rgba(39,243,228,.5),inset 0 0 16px rgba(39,243,228,.25)}
.mic svg{width:30px;height:30px}
.mic.live{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 30px rgba(39,243,228,.9),inset 0 0 22px rgba(39,243,228,.5)}}
#log{position:absolute;z-index:4;left:8px;right:8px;top:66px;bottom:96px;padding:10px;border:1px solid rgba(39,243,228,.25);border-radius:14px;
  background:rgba(3,26,30,.9);overflow-y:auto;display:none;-webkit-user-select:text;user-select:text}
#log.open{display:block}
.msg{margin:0 0 10px;font-size:14px;line-height:1.4;color:#c9fffb;word-wrap:break-word;white-space:pre-wrap}
.msg b{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
.msg.you{color:#fff}.msg.sys{color:var(--dim);font-size:12px}
.empty{color:var(--dim);font-size:13px;text-align:center;margin-top:30px}
#typebar{position:absolute;z-index:5;left:8px;right:8px;bottom:84px;display:none;gap:8px}
#typebar.open{display:flex}
#typebar input{flex:1;min-width:0;height:44px;border-radius:22px;border:1px solid rgba(39,243,228,.5);background:rgba(2,22,25,.96);
  color:#eafffd;padding:0 16px;font-size:15px;outline:none;-webkit-user-select:text;user-select:text}
#typebar button{width:44px;height:44px;border-radius:50%;border:1px solid var(--c);background:rgba(39,243,228,.14);color:var(--c);padding:0;display:grid;place-items:center}
</style>
</head>
<body>
<div class="bg"></div>
<svg class="hex" viewBox="0 0 170 190" aria-hidden="true"><defs>
<pattern id="h" width="34.6" height="40" patternUnits="userSpaceOnUse" patternTransform="scale(1)">
<path d="M17.3 0 34.6 10v20L17.3 40 0 30V10z" fill="none" stroke="#27f3e4" stroke-width="1"/></pattern></defs>
<rect width="170" height="190" fill="url(#h)"/></svg>

<div class="top">
  <button class="ib" id="bSpeak" aria-label="Speak answers aloud"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="waves" d="M16.5 9a4.5 4.5 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/></svg></button>
  <div class="title">JARVIS</div>
  <button class="ib" id="bSet" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg></button>
</div>
<div class="link" id="link"><i id="dot"></i><span id="linkText">Starting...</span></div>

<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="sub" id="sub"></div>
</div>
<div id="log"><div class="empty" id="empty">Nothing said yet.</div></div>
<div id="typebar"><input id="inp" type="text" placeholder="Message JARVIS" enterkeyhint="send" autocomplete="off"><button id="bSend" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>

<nav>
  <button class="ib" id="bLog" aria-label="History"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
  <button class="ib" id="bSync" aria-label="Sync memory"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.5 6.2M3 12a9 9 0 0 1 15.5-6.2M18 3v4h-4M6 21v-4h4"/></svg></button>
  <button class="mic" id="bMic" aria-label="Talk"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <button class="ib" id="bKey" aria-label="Type"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></button>
  <button class="ib" id="bClear" aria-label="New conversation"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
</nav>

<script>
(function () {
"use strict";
var $ = function (s) { return document.querySelector(s); };
var native = window.JarvisNative || null;
function call(fn, a) {
  try { if (native && typeof native[fn] === "function") { return a === undefined ? native[fn]() : native[fn](a); } } catch (e) {}
}

// ---- state --------------------------------------------------------------
var S = { listening: false, busy: false, sleeping: false, speakUntil: 0, thinkUntil: 0,
          speak: true, msgs: [], subTimer: 0 };
var LABEL = { you: "You", pc_user: "You (at the PC)", pc: "JARVIS \u00b7 PC", phone: "JARVIS \u00b7 phone", sys: "" };

function now() { return performance.now(); }
function mood() {
  var t = now();
  if (S.sleeping) return "sleeping";
  if (S.listening) return "listening";
  if (t < S.speakUntil) return "speaking";
  if (S.busy || t < S.thinkUntil) return "thinking";
  return "idle";
}

// ---- messages -----------------------------------------------------------
function addMsg(who, text, quiet) {
  text = String(text == null ? "" : text);
  if (!text) { return; }
  S.msgs.push({ who: who, text: text });
  if (S.msgs.length > 120) { S.msgs.shift(); }
  var log = $("#log"), empty = $("#empty");
  if (empty) { empty.remove(); }
  var d = document.createElement("div");
  d.className = "msg " + (who === "you" || who === "pc_user" ? "you" : who === "sys" ? "sys" : "");
  if (LABEL[who]) { var b = document.createElement("b"); b.textContent = LABEL[who]; d.appendChild(b); }
  var s = document.createElement("span"); s.textContent = text; d.appendChild(s);
  log.appendChild(d);
  while (log.children.length > 120) { log.removeChild(log.firstChild); }
  log.scrollTop = log.scrollHeight;
  if (quiet) { return; }          // replayed history: show it, but do not animate
  var t = now();
  if (who === "pc" || who === "phone") {
    S.thinkUntil = 0; S.busy = false;
    S.speakUntil = t + Math.min(20000, Math.max(1600, 500 + text.length * 60));
    var sub = $("#sub"); sub.textContent = text.length > 220 ? text.slice(0, 217) + "..." : text; sub.className = "sub show";
    clearTimeout(S.subTimer);
    S.subTimer = setTimeout(function () { sub.className = "sub"; }, Math.min(20000, 5000 + text.length * 55));
  } else if (who === "you" || who === "pc_user") {
    S.thinkUntil = t + 15000;
  }
}

window.jarvis = {
  onState: function (s) {
    s = s || {};
    if (typeof s.link === "string") { $("#linkText").textContent = s.link; }
    if (typeof s.online === "boolean") { $("#dot").className = s.online ? "on" : ""; }
    if (typeof s.speak === "boolean") { setSpeak(s.speak, true); }
  },
  onMessage: function (who, text, quiet) { addMsg(who, text, !!quiet); },
  onListening: function (b) { S.listening = !!b; $("#bMic").className = "mic" + (b ? " live" : ""); },
  onBusy: function (b) { S.busy = !!b; },
  onStatus: function (st) { S.sleeping = (String(st) === "sleeping"); },
  clear: function () {
    S.msgs = []; var log = $("#log"); log.innerHTML = ""; var e = document.createElement("div");
    e.className = "empty"; e.id = "empty"; e.textContent = "Nothing said yet."; log.appendChild(e);
    $("#sub").className = "sub";
  }
};

// ---- controls -----------------------------------------------------------
function setSpeak(on, quiet) {
  S.speak = !!on;
  $("#bSpeak").className = "ib" + (on ? "" : " off");
  $("#waves").style.display = on ? "" : "none";
  if (!quiet) { call("setSpeak", on); }
}
function toggle(sel, force) { var el = $(sel); var open = force === undefined ? !el.classList.contains("open") : force; el.classList.toggle("open", open); return open; }

function send(text) {
  text = String(text || "").trim();
  if (!text) { return; }
  if (native) { call("send", text); }
  else { addMsg("you", text); setTimeout(function () { addMsg("phone", "Demo mode - open this page inside the JARVIS app to talk to the real thing."); }, 900); }
}

$("#bSpeak").onclick = function () { setSpeak(!S.speak); };
$("#bSet").onclick = function () { call("settings"); };
$("#bSync").onclick = function () { call("sync"); addMsg("sys", "Syncing memory..."); };
$("#bClear").onclick = function () { call("reset"); window.jarvis.clear(); };
$("#bLog").onclick = function () { toggle("#log"); };
$("#bKey").onclick = function () {
  var open = toggle("#typebar"); if (open) { $("#inp").focus(); } else { $("#inp").blur(); }
};
$("#bSend").onclick = function () { var i = $("#inp"); send(i.value); i.value = ""; };
$("#inp").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); $("#bSend").onclick(); } });
function mic() {
  if (native) { call("mic"); }
  else { S.listening = true; $("#bMic").className = "mic live"; setTimeout(function () { window.jarvis.onListening(false); send("What can you do?"); }, 2200); }
}
$("#bMic").onclick = mic;
$("#c").onclick = mic;

// ---- the animation --------------------------------------------------------
var cv = $("#c"), ctx = cv.getContext("2d"), W = 0, H = 0;
function resize() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2), r = cv.getBoundingClientRect();
  W = r.width; H = r.height; cv.width = Math.max(1, Math.round(W * dpr)); cv.height = Math.max(1, Math.round(H * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);

var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
var amp = 0.03, spin = 0, level = 0, parts = [];
for (var k = 0; k < 46; k++) { parts.push({ a: Math.random() * 6.283, r: 0.92 + Math.random() * 0.5, v: (Math.random() - 0.5) * 0.25, s: 0.6 + Math.random() * 1.4 }); }

function rgba(a) { return "rgba(39,243,228," + a.toFixed(3) + ")"; }

function ring(cx, cy, R, t, phase, am, alpha, lw, n) {
  var pts = [], i, th, r;
  for (i = 0; i < n; i++) {
    th = i / n * 6.2832;
    r = R * (1 + am * (Math.sin(3 * th + t * 1.1 + phase) + 0.6 * Math.sin(5 * th - t * 1.7 + phase * 2) + 0.35 * Math.sin(9 * th + t * 2.3 - phase)));
    pts.push([cx + r * Math.cos(th), cy + r * Math.sin(th)]);
  }
  ctx.beginPath();
  for (i = 0; i < n; i++) { if (i === 0) { ctx.moveTo(pts[i][0], pts[i][1]); } else { ctx.lineTo(pts[i][0], pts[i][1]); } }
  ctx.closePath(); ctx.strokeStyle = rgba(alpha); ctx.lineWidth = lw; ctx.stroke();
  return pts;
}

function draw(tms) {
  var t = tms / 1000, m = mood(), cx = W / 2, cy = H * 0.47, R = Math.min(W * 0.4, H * 0.36);
  ctx.clearRect(0, 0, W, H);

  // how wobbly the rings are, per mood
  level += (Math.random() - 0.5) * 0.5; level = Math.max(0, Math.min(1, level * 0.85 + 0.1));
  var env = 0.5 + 0.5 * Math.sin(t * 9.1) * Math.sin(t * 4.3 + 1.2);
  var target = m === "listening" ? 0.05 + level * 0.1 : m === "speaking" ? 0.05 + env * 0.09
             : m === "thinking" ? 0.05 : m === "sleeping" ? 0.012 : 0.03;
  if (reduce) { target *= 0.3; }
  amp += (target - amp) * 0.09;
  spin += (m === "thinking" ? 1.6 : m === "sleeping" ? 0.08 : 0.35) * 0.033;
  var glow = m === "sleeping" ? 0.45 : 1;

  ctx.save();
  ctx.shadowColor = "rgba(39,243,228,.9)"; ctx.shadowBlur = 12 * glow; ctx.lineJoin = "round";

  // outer wobbling wireframe
  var A = ring(cx, cy, R * 1.0, t, 0.0, amp * 1.0, 0.85 * glow, 1.6, 150);
  var B = ring(cx, cy, R * 0.94, t, 1.7, amp * 1.15, 0.55 * glow, 1.1, 150);
  var C = ring(cx, cy, R * 0.88, t, 3.1, amp * 1.3, 0.35 * glow, 1.0, 150);
  ctx.shadowBlur = 0; ctx.lineWidth = 0.6; ctx.strokeStyle = rgba(0.2 * glow); ctx.beginPath();
  for (var i = 0; i < 150; i += 3) { ctx.moveTo(A[i][0], A[i][1]); ctx.lineTo(B[i][0], B[i][1]); ctx.lineTo(C[i][0], C[i][1]); }
  ctx.stroke();
  ctx.shadowBlur = 10 * glow;

  // inner rings, ticks and arcs
  ctx.lineWidth = 1; ctx.strokeStyle = rgba(0.45 * glow);
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.6, 0, 6.2832); ctx.stroke();
  ctx.strokeStyle = rgba(0.25 * glow); ctx.beginPath(); ctx.arc(cx, cy, R * 0.5, 0, 6.2832); ctx.stroke();
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(spin * 0.4);
  ctx.strokeStyle = rgba(0.5 * glow); ctx.lineWidth = 1;
  for (var j = 0; j < 72; j++) {
    var a = j / 72 * 6.2832, l = j % 6 === 0 ? 9 : 4;
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * R * 0.66, Math.sin(a) * R * 0.66); ctx.lineTo(Math.cos(a) * (R * 0.66 + l), Math.sin(a) * (R * 0.66 + l)); ctx.stroke();
  }
  ctx.restore();
  ctx.lineWidth = 2.4; ctx.strokeStyle = rgba(0.8 * glow);
  for (var q = 0; q < 3; q++) {
    var s0 = spin * (q % 2 ? -1.1 : 1.3) + q * 2.09;
    ctx.beginPath(); ctx.arc(cx, cy, R * (0.56 + q * 0.0), s0, s0 + 0.9 + (m === "listening" ? level * 0.8 : 0)); ctx.stroke();
  }
  if (m === "thinking") {
    ctx.fillStyle = rgba(0.95);
    for (var d = 0; d < 3; d++) { var ad = spin * 2 + d * 2.094; ctx.beginPath(); ctx.arc(cx + Math.cos(ad) * R * 0.73, cy + Math.sin(ad) * R * 0.73, 2.6, 0, 6.2832); ctx.fill(); }
  }
  ctx.restore();

  // drifting particles
  ctx.fillStyle = rgba(0.5 * glow);
  for (var p = 0; p < parts.length; p++) {
    var o = parts[p]; o.a += o.v * 0.01; var rr = R * (o.r + 0.05 * Math.sin(t * o.s + p));
    ctx.fillRect(cx + Math.cos(o.a) * rr, cy + Math.sin(o.a) * rr, o.s, o.s);
  }

  // the name, with a little scan-line and glitch while thinking
  var txt = "JARVIS", fs = R * 0.3, gap = fs * 0.12, i2, wTot = 0, widths = [];
  ctx.font = "italic 800 " + fs + "px 'Segoe UI', Roboto, Arial, sans-serif";
  for (i2 = 0; i2 < txt.length; i2++) { var wc = ctx.measureText(txt[i2]).width; widths.push(wc); wTot += wc + gap; }
  wTot -= gap;
  var x = cx - wTot / 2, y = cy + fs * 0.34, jit = m === "thinking" ? 1 : 0;
  ctx.save(); ctx.shadowColor = "rgba(39,243,228,.95)"; ctx.shadowBlur = 14 * glow;
  ctx.fillStyle = rgba((0.82 + 0.12 * Math.sin(t * 2.2)) * glow);
  for (i2 = 0; i2 < txt.length; i2++) {
    var oy = jit && Math.random() < 0.06 ? (Math.random() - 0.5) * 5 : 0;
    ctx.fillText(txt[i2], x, y + oy); x += widths[i2] + gap;
  }
  ctx.restore();
  ctx.fillStyle = "rgba(1,16,18,.3)";
  for (var sl = cy - fs * 0.7; sl < cy + fs * 0.5; sl += 3) { ctx.fillRect(cx - wTot / 2 - 4, sl, wTot + 8, 1); }
}

var last = 0, frameMs = reduce ? 90 : 33;
function loop(ts) {
  requestAnimationFrame(loop);
  if (document.hidden || ts - last < frameMs) { return; }
  last = ts;
  try { draw(ts); } catch (e) { /* never let a drawing glitch stop the loop */ }
}
resize(); setSpeak(true, true); requestAnimationFrame(loop);
window.__jarvisMood = mood;
call("ready");
})();
</script>
</body>
</html>
